---
# DeepSUMO-style ST-GAT on Chattanooga SUMO data
base_dir: data

data:
  nodes_csv:        ../data/graph/nodes.csv
  edges_csv:        ../data/graph/edges.csv
  traffic_h5:       ../data/traffic/traffic_jan2026.h5
  output_dir:       data/
  network_threshold_m: 500    # connect detectors within this road-network distance
  variance_threshold: 1.0     # drop detectors with speed variance < this
  features:                    # which channels to use as node features
    - speed
    - occupancy
    - volume
  train_ratio: 0.70
  val_ratio:   0.10
  test_ratio:  0.20

model:
  n_hist:      12    # input timesteps  (12 × 5min = 1 hour history)
  n_pred:      12    # output timesteps (12 × 5min = 1 hour ahead)
  n_features:  3     # speed + occupancy + volume
  gat_heads:   2     # 2 heads: vectorised (B*T,N,N,2) fits 6GB; 4 heads ~2x memory
  gat_hidden:  32    # hidden dim per head → layer1 out=64, layer2 out=32 (averaged)
  gat_layers:  2     # number of stacked GAT layers
  lstm_hidden: 128   # LSTM hidden size
  dropout:     0.3

train:
  epochs:        100
  batch_size:    32     # vectorised timesteps: effective B*T=384; fits with H=2
  lr:            3.0e-4
  weight_decay:  5.0e-5
  patience:      20
  test_every_n_epochs: 10
